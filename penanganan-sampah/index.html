<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kehadiran - Program Penanganan Sampah</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo-container">
                <img src="./DRPM.jpg" alt="Logo DRPM" class="logo">
            </div>
            <h1>PROGRAM PENANGANAN SAMPAH</h1>
            <h3>Kecamatan Buahbatu</h3>
            <p>DRPM Universitas Teknologi Bandung</p>
        </div>

        <!-- Pemilihan Mode Pencarian -->
        <div class="toggle-container">
            <div class="toggle-btn active" id="btn-mode-nim" onclick="switchMode('nim')">Pencarian per NIM</div>
            <div class="toggle-btn" id="btn-mode-rw" onclick="switchMode('rw')">Pencarian per RW</div>
        </div>

        <!-- Form Pencarian Mode NIM -->
        <div id="form-nim">
            <div class="form-group">
                <label class="section-label" for="jurusan">Pilih Jurusan Mahasiswa:</label>
                <select id="jurusan" class="dropdown-select">
                    <option value="" disabled selected>-- Silakan Pilih Jurusan --</option>
                    <option value="ti">Teknik Informatika</option>
                    <option value="industri">Teknik Industri</option>
                    <option value="dkv">Desain Komunikasi Visual</option>
                    <option value="bisnis">Bisnis Digital</option>
                    <option value="ritel">Manajemen Ritel</option>
                </select>
            </div>

            <div class="form-group">
                <label class="section-label" for="nim">Nomor Induk Mahasiswa (NIM):</label>
                <input type="text" id="nim" placeholder="Contoh: 22262011298" autocomplete="off" onkeypress="handleEnter(event)">
            </div>

            <button onclick="cariDataNIM()">Cek Kehadiran</button>
        </div>

        <!-- Form Pencarian Mode RW -->
        <div id="form-rw" style="display: none;">
            <div class="form-group">
                <label class="section-label" for="rw-select">Pilih RW:</label>
                <select id="rw-select" class="dropdown-select">
                    <option value="" disabled selected>-- Silakan Pilih RW --</option>
                    <!-- Opsi RW akan di-generate via JavaScript -->
                </select>
            </div>
            
            <button onclick="cariDataRW()">Cek Kehadiran RW</button>
        </div>

        <div id="loading">Memuat data....</div>
        <div id="error-message"></div>

        <!-- Hasil Pencarian per NIM (Card Style) -->
        <div id="result-section">
            <div class="student-info">
                <h2 id="res-nama">Nama Mahasiswa</h2>
                <p>NIM: <span id="res-nim">-</span> | Jurusan: <span id="res-jurusan">-</span></p>
            </div>
            
            <h3 style="font-size: 15px; margin-bottom: 5px; color: var(--text-main);">Detail Kehadiran:</h3>
            <div id="attendance-container"></div>
            
            <div id="summary-section">
                <h3 style="font-size: 15px; margin-bottom: 15px; color: var(--text-main);">Ringkasan Keseluruhan:</h3>
                <div id="summary-container" class="summary-grid">
                </div>
            </div>
        </div>

        <!-- Hasil Pencarian per RW (Table Style) -->
        <div id="result-rw-section" style="display: none;">
            <div class="student-info">
                <h2 id="rw-title">Data Kehadiran RW</h2>
            </div>
            <div id="rw-table-container"></div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
