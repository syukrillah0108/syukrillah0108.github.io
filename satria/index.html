<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio | Memuat...</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Tombol Bahasa di Pojok Kanan Atas -->
    <div class="lang-toggle">
        <button id="btn-id" class="lang-btn active">ID</button> | 
        <button id="btn-en" class="lang-btn">EN</button>
    </div>

    <header>
        <div class="container header-wrapper">
            <img id="profile-img" src="" alt="Foto Profil" class="profile-pic">
            <div class="header-text">
                <h1 id="profile-name">Memuat...</h1>
                <h2 id="profile-title"></h2>
                <p id="profile-about"></p>
                <div class="links">
                    <a id="link-wa" href="#" target="_blank">WhatsApp</a>
                    <a id="link-email" href="#">Email</a>
                    <a id="link-ig" href="#" target="_blank">Instagram</a>
                    <a id="link-capcut" href="#" target="_blank">CapCut</a>
                    <a id="alamat" href="#" target="_blank">Lokasi</a>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <section id="skills-section">
            <h3 id="ui-skills-title">Keahlian</h3>
            <ul id="skills-list" class="tags-list"></ul>
        </section>

        <section id="projects-section">
            <h3 id="ui-projects-title">Pengalaman Kerja</h3>
            <div id="projects-grid" class="grid"></div>
        </section>

        <section id="experience-section">
            <h3 id="ui-experience-title">Pengalaman & Organisasi</h3>
            <div id="experience-list"></div>
        </section>
    </main>

    <div id="project-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2 id="modal-title">Judul Proyek</h2>
            <div id="modal-tech" class="modal-tech tags-list" style="margin-bottom: 1rem;"></div>
            <p id="modal-detail">Detail deskripsi proyek di sini...</p>
            <h4 id="ui-docs-title" style="margin-top: 2rem;">Dokumentasi</h4>
            <div id="modal-docs" class="docs-grid"></div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2026 <span id="footer-name"></span>. <span id="ui-footer-text">Dibangun dengan HTML, CSS, JS & JSON.</span></p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
